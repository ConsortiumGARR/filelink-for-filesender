<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>fscrypto test</title>
</head>
<body>
<div id="summary"></div>
<ol id="results"></ol>
<script id="vectors" type="application/json">{"password": "Test-Password_123!", "salt": "dGVzdC1zYWx0LTEyMzQ1Njc4", "iterations": 1000, "ivLength": 16, "chunkSize": 16, "size": 40, "ivBytes": "AQIDBAUGBwgJCgsM", "expectedIv": "AQIDBAUGBwgJCgsM", "expectedAead": "{\"aeadversion\":1,\"chunkcount\":3,\"chunksize\":16,\"iv\":\"AQIDBAUGBwgJCgsM\",\"aeadterminator\":1}", "chunks": [{"index": 0, "plain": "AwoRGB8mLTQ7QklQV15lbA==", "expected": "AQIDBAUGBwgJCgsMAAAAAJcNgBDvaoyUaiHSmdDZzDERZ3vgJwllaZLhKSczaVz8"}, {"index": 1, "plain": "c3qBiI+WnaSrsrnAx87V3A==", "expected": "AQIDBAUGBwgJCgsMAQAAAAMKP9PD0AV0xEBgXbRm8MU+0SWjBs/EE6FmSTbYBr0R"}, {"index": 2, "plain": "4+rx+P8GDRQ=", "expected": "AQIDBAUGBwgJCgsMAgAAAPCOcUFGQVZVhtjO7owYrZwnl7NB0XZDog=="}]}</script>
<script>(function (global) {
  'use strict';

  const te = new TextEncoder();

  const UPPER = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const LOWER = 'abcdefghijklmnopqrstuvwxyz';
  const DIGITS = '0123456789';
  const SPECIAL = '!@#$%^&*()-_=+[]{};:,.?';

  function bytesToB64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }

  function randomBytes(n) {
    const out = new Uint8Array(n);
    crypto.getRandomValues(out);
    return out;
  }

  function randomIndex(n) {
    const limit = 256 - (256 % n);
    const b = new Uint8Array(1);
    do {
      crypto.getRandomValues(b);
    } while (b[0] >= limit);
    return b[0] % n;
  }

  function checkPassword(pw, rules) {
    rules = rules || {};
    const failed = [];
    if (!/^[\x20-\x7e]*$/.test(pw)) failed.push('ascii');
    if (pw.length < (rules.minPasswordLength || 1)) failed.push('length');
    if (rules.mixedCase && !(/[a-z]/.test(pw) && /[A-Z]/.test(pw))) failed.push('mixedCase');
    if (rules.numbers && !/[0-9]/.test(pw)) failed.push('numbers');
    if (rules.special && !/[^A-Za-z0-9]/.test(pw)) failed.push('special');
    return failed;
  }

  function generatePassword(rules) {
    rules = rules || {};
    const len = Math.max(rules.generatedPasswordLength || 0, rules.minPasswordLength || 0, 16);
    const all = UPPER + LOWER + DIGITS + SPECIAL;
    const chars = [UPPER, LOWER, DIGITS, SPECIAL].map((set) => set[randomIndex(set.length)]);
    while (chars.length < len) chars.push(all[randomIndex(all.length)]);
    for (let i = chars.length - 1; i > 0; i--) {
      const j = randomIndex(i + 1);
      [chars[i], chars[j]] = [chars[j], chars[i]];
    }
    return chars.join('');
  }

  function aeadString(ivB64, chunkCount, chunkSize) {
    return (
      '{"aeadversion":1,"chunkcount":' +
      chunkCount +
      ',"chunksize":' +
      chunkSize +
      ',"iv":"' +
      ivB64 +
      '","aeadterminator":1}'
    );
  }

  function newFileParams(ivLength, size, chunkSize, ivBytes) {
    ivBytes = ivBytes || randomBytes(ivLength - 4);
    const ivB64 = bytesToB64(ivBytes);
    const aead = aeadString(ivB64, Math.ceil(size / chunkSize), chunkSize);
    return { ivBytes, ivB64, aead, aeadB64: btoa(aead) };
  }

  async function deriveKey(password, salt, iterations) {
    const base = await crypto.subtle.importKey('raw', te.encode(password), 'PBKDF2', false, [
      'deriveKey',
    ]);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: te.encode(salt), iterations, hash: 'SHA-256' },
      base,
      { name: 'AES-GCM', length: 256 },
      false,
      ['encrypt'],
    );
  }

  async function encryptChunk(key, ivBytes, chunkIndex, aead, data) {
    const fullIv = new Uint8Array(ivBytes.length + 4);
    fullIv.set(ivBytes, 0);
    new DataView(fullIv.buffer).setUint32(ivBytes.length, chunkIndex, true);
    const ct = new Uint8Array(
      await crypto.subtle.encrypt(
        { name: 'AES-GCM', iv: fullIv, additionalData: te.encode(aead), tagLength: 128 },
        key,
        data,
      ),
    );
    const out = new Uint8Array(fullIv.length + ct.length);
    out.set(fullIv, 0);
    out.set(ct, fullIv.length);
    return out;
  }

  global.fscrypto = {
    checkPassword,
    generatePassword,
    aeadString,
    newFileParams,
    deriveKey,
    encryptChunk,
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);
</script>
<script>
(async function () {
  const summary = document.getElementById('summary');
  const results = document.getElementById('results');
  let pass = 0;
  let fail = 0;
  function check(name, ok, detail) {
    const li = document.createElement('li');
    li.textContent = (ok ? 'PASS ' : 'FAIL ') + name + (ok || !detail ? '' : ' -- ' + detail);
    results.appendChild(li);
    if (ok) pass++; else fail++;
  }
  function b64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function bytesToB64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  try {
    const fc = globalThis.fscrypto;
    const v = JSON.parse(document.getElementById('vectors').textContent);
    const p = fc.newFileParams(v.ivLength, v.size, v.chunkSize, b64ToBytes(v.ivBytes));
    check('iv', p.ivB64 === v.expectedIv, p.ivB64);
    check('aead', p.aead === v.expectedAead, p.aead);
    const key = await fc.deriveKey(v.password, v.salt, v.iterations);
    for (const c of v.chunks) {
      const out = await fc.encryptChunk(key, p.ivBytes, c.index, p.aead, b64ToBytes(c.plain));
      const got = bytesToB64(out);
      check('chunk ' + c.index, got === c.expected, got);
    }
    const rules = { minPasswordLength: 12, mixedCase: true, numbers: true, special: true,
      generatedPasswordLength: 30 };
    check('rules ok', fc.checkPassword('Abcdefgh123!', rules).length === 0);
    check('rules short', fc.checkPassword('Ab1!', rules).includes('length'));
    check('rules case', fc.checkPassword('abcdefgh123!', rules).includes('mixedCase'));
    check('rules numbers', fc.checkPassword('Abcdefghijk!', rules).includes('numbers'));
    check('rules special', fc.checkPassword('Abcdefgh1234', rules).includes('special'));
    check('rules ascii', fc.checkPassword('Abcdefgh123!è', rules).includes('ascii'));
    let genOk = true;
    for (let i = 0; i < 50; i++) {
      const g = fc.generatePassword(rules);
      if (g.length !== 30 || fc.checkPassword(g, rules).length) { genOk = false; break; }
    }
    check('generated passwords', genOk);
  } catch (err) {
    check('exception', false, String(err && err.stack || err));
  }
  summary.textContent = (fail === 0 ? 'ALL PASS' : fail + ' FAILED') + '  (' + pass + '/' + (pass + fail) + ' passed)';
})();
</script>
</body>
</html>
