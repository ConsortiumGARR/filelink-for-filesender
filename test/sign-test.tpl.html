<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>FileSender signing differential test</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem; }
  li { margin: 0.4rem 0; }
  #log { background: #f4f4f4; padding: 1rem; }
</style>
</head>
<body>
<h1>FileSender signing differential test</h1>
<p>JS <code>src/lib/filesender.js</code> vs ground-truth vectors generated from
<code>filesender.py</code> <code>call()</code>.</p>
<div id="summary"></div>
<ol id="results"></ol>
<pre id="log"></pre>

<script>
__LIB__
</script>

<script id="vectors" type="application/json">
__VECTORS__
</script>

<script>
(async function () {
  const summary = document.getElementById('summary');
  const results = document.getElementById('results');
  const log = document.getElementById('log');

  const FS = globalThis.filesender;
  if (!FS) {
    summary.textContent = 'FAIL: src/lib/filesender.js did not load (globalThis.filesender is undefined)';
    summary.style.color = '#c00';
    return;
  }
  const V = JSON.parse(document.getElementById('vectors').textContent);
  if (typeof crypto === 'undefined' || !crypto.subtle) {
    summary.textContent = 'FAIL: Web Crypto (crypto.subtle) not available in this environment';
    summary.style.color = '#c00';
    return;
  }

  let pass = 0, fail = 0;

  for (const c of V.cases) {
    const li = document.createElement('li');
    let err = null;
    const checks = [];
    try {
      const opts = {
        method: c.method,
        baseUrl: V.baseUrl,
        path: c.path,
        data: c.data,
        username: V.username,
        apikey: V.apikey,
        timestamp: V.timestamp,
      };
      if (c.content !== null && c.content !== undefined) opts.content = c.content;
      if (c.rawContent !== null) opts.rawContent = FS.b64ToBytes(c.rawContent);
      const r = await FS.signedRequest(opts);
      checks.push({ ok: FS.bytesToB64(r.signed) === c.expectedSignedB64, label: 'signed bytes', got: FS.bytesToB64(r.signed), exp: c.expectedSignedB64 });
      checks.push({ ok: r.signature === c.expectedSignature, label: 'signature', got: r.signature, exp: c.expectedSignature });
      checks.push({ ok: r.url === c.expectedUrl, label: 'url', got: r.url, exp: c.expectedUrl });
    } catch (e) {
      err = e;
    }
    const ok = !err && checks.every((x) => x.ok);
    if (ok) { pass++; li.style.color = '#0a0'; } else { fail++; li.style.color = '#c00'; }
    li.textContent = (ok ? 'PASS' : 'FAIL') + '  ' + c.name;
    if (!ok) {
      const d = document.createElement('div');
      d.style.marginLeft = '20px';
      d.style.whiteSpace = 'pre';
      d.style.fontSize = '12px';
      d.textContent = (err ? 'ERROR: ' + (err && err.stack || err) + '\n' : '') +
        checks.map((x) => (x.ok ? '  ok ' : '  BAD') + ' ' + x.label + '\n        got: ' + x.got + '\n        exp: ' + x.exp).join('\n');
      li.appendChild(d);
    }
    results.appendChild(li);
  }

  summary.textContent = (fail === 0 ? 'ALL PASS' : fail + ' FAILED') + '  (' + pass + '/' + (pass + fail) + ' passed)';
  summary.style.color = fail === 0 ? '#0a0' : '#c00';
  summary.style.fontWeight = 'bold';
  log.textContent = 'baseUrl  = ' + V.baseUrl +
    '\nusername = ' + V.username +
    '\ntimestamp= ' + V.timestamp;
})();
</script>
</body>
</html>
