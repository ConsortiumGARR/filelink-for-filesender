<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title data-i18n="optTitle"></title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/options.css" />
  </head>
  <body>
    <h2 data-i18n="optTitle"></h2>
    <ul id="files"></ul>

    <h3 data-i18n="optTransferTitle"></h3>
    <div class="row">
      <label for="days" data-i18n="mgmtDays"></label>
      <select id="days"></select>
    </div>
    <label class="check"
      ><input type="checkbox" data-option="email_me_on_expire" />
      <span data-i18n="optEmailMeOnExpire"></span
    ></label>
    <label class="check"
      ><input type="checkbox" data-option="email_upload_complete" />
      <span data-i18n="optEmailUploadComplete"></span
    ></label>
    <label class="check"
      ><input type="checkbox" data-option="email_download_complete" />
      <span data-i18n="optEmailDownloadComplete"></span
    ></label>
    <label class="check"
      ><input type="checkbox" data-option="email_report_on_closing" />
      <span data-i18n="optEmailReportOnClosing"></span
    ></label>
    <label class="check"
      ><input type="checkbox" data-option="must_be_logged_in_to_download" />
      <span data-i18n="optMustBeLoggedIn"></span
    ></label>

    <div id="encSection" hidden>
      <h3 data-i18n="optEncryptionTitle"></h3>
      <label class="check"
        ><input id="encrypt" type="checkbox" /> <span data-i18n="optEncrypt"></span
      ></label>
      <div id="pwBox" hidden>
        <div class="pwrow">
          <input id="password" type="password" autocomplete="off" spellcheck="false" />
          <button id="show" type="button" data-i18n="optShow"></button>
          <button id="generate" type="button" data-i18n="optGenerate"></button>
          <button id="copy" type="button" data-i18n="optCopy"></button>
        </div>
        <div class="hint" id="pwRules"></div>
        <div id="pwErrors"></div>
        <div class="warn" data-i18n="optPasswordWarning"></div>
      </div>
    </div>

    <p class="hint" data-i18n="cleanupNote"></p>
    <div class="actions">
      <button id="cancel" type="button" data-i18n="optCancel"></button>
      <button id="upload" type="button" class="primary" data-i18n="optUpload"></button>
    </div>
    <script src="../lib/fscrypto.js"></script>
    <script src="../lib/ui-common.js"></script>
    <script src="options.js"></script>
  </body>
</html>
