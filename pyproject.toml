# Tooling configuration only: not a Python package, no [build-system].
[project]
name = "filelink-for-filesender-dev-tools"
version = "0"
requires-python = ">=3.12"

[dependency-groups]
dev = ["black==26.10.1", "ruff==0.17.1"]
security = ["semgrep==1.182.0", "zizmor==1.31.1"]

[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = "^/reference/"

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
